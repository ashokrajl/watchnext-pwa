<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <title>WatchNext — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b10;
        color: #f2f2f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #8e8e93; margin: 0 0 20px; }
      button {
        background: #f5b942;
        color: #0b0b10;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>WatchNext needs a connection to fetch movies. Your saved lists are safe on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
